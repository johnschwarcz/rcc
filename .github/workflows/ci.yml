name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The README promises 3.10+, so every version it promises gets tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # One run each on macOS and Windows: the figures touch matplotlib
          # backends, and torch ships a different wheel on every platform.
          - python-version: "3.12"
            os: macos-latest
          - python-version: "3.12"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The CPU wheel: no runner has a GPU, and the CUDA build is ~2 GB.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples docs conftest.py conftest.py

      - name: Test
        # Headless: no display on any runner.
        env:
          MPLBACKEND: Agg
        run: pytest -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run every example
        # Short runs: this checks that they execute, not that they converge.
        # tests/test_learning.py is what checks that they learn.
        env:
          MPLBACKEND: Agg
        # _common.py is shared plumbing, not a runnable example.
        run: |
          for f in examples/[!_]*.py; do
            echo "--- $f"
            python "$f" --out "$RUNNER_TEMP/figures" --iterations 20
          done
      - name: Regenerate the README figures
        env:
          MPLBACKEND: Agg
        run: python docs/make_assets.py --out "$RUNNER_TEMP/images" --iterations 20
